[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wastech-orchestrator"
# Version is derived from the Git tag (hatch-vcs); tag `vX.Y.Z[aN|bN|rcN]` to release. See docs/RELEASING.md.
dynamic = ["version"]
description = "Lean-оркестратор кодинг-агентов (Codex / Claude Code) с публикацией в Git"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "watchdog>=4.0",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
]
docs = [
    "mkdocs>=1.6",
]
# `worc shell` (the interactive operator console). Optional: the daemon, headless/CI installs, and
# every non-console command never import prompt_toolkit. `worc top` is stdlib-only and needs nothing
# here. Install with `pip install wastech-orchestrator[shell]`.
shell = [
    "prompt_toolkit>=3",
]

[project.scripts]
wastech-orchestrator = "wastech_orchestrator.cli:main"
# `worc` is a short alias for the canonical `wastech-orchestrator` command; same entry point.
worc = "wastech_orchestrator.cli:main"

[tool.hatch.version]
# The version comes from the Git tag (e.g. tag `v0.1.1a1` -> version `0.1.0a1`). Between tags,
# builds get a dev version like `0.1.0a1.dev3+g<sha>`. Requires full history at build time
# (CI: actions/checkout with fetch-depth: 0). See docs/RELEASING.md.
source = "vcs"

[tool.hatch.build.targets.wheel]
# Non-.py files under the package (the aggregated `packaged/` tree — config example, built-in
# flows + role prompts, and the task-authoring guide, used by `init`) ship as package data.
packages = ["src/wastech_orchestrator"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["^tests/"]

# prompt_toolkit is the optional [shell] extra — not installed for a headless `mypy src` run in CI,
# so tolerate its absence (imported lazily inside `worc shell`).
[[tool.mypy.overrides]]
module = "prompt_toolkit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
