[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wastech-orchestrator"
# Version is derived from the Git tag (hatch-vcs); tag `vX.Y.Z[aN|bN|rcN]` to release. See docs/RELEASING.md.
dynamic = ["version"]
description = "Lean-оркестратор кодинг-агентов (Codex / Claude Code) с публикацией в Git"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Vladimir Makarevich", email = "vladimir.makarevich.23@gmail.com" }]
dependencies = [
    "PyYAML>=6.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    # The extended lint set (FURB, PERF, PTH, T20, RUF, …) needs a recent ruff; older ruff aborts on
    # unknown rule selectors. Keep this floor at/above the version whose rules we select below.
    "ruff>=0.15",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",   # parallel test execution (`-n auto`)
    "types-PyYAML",
    # Quality tooling (see docs/analysis/linting-and-code-quality-investigation.md):
    "import-linter>=2.0",  # architectural import-boundary contracts (.importlinter)
    "pre-commit>=3.7",     # local quality gate mirroring CI (.pre-commit-config.yaml)
    "interrogate>=1.7",    # docstring-coverage threshold
    "vulture>=2.11",       # dead-code detection
    "deptry>=0.20",        # dependency hygiene
]
docs = [
    "mkdocs>=1.6",
]
# `worc shell` (the interactive operator console). Optional: the daemon, headless/CI installs, and
# every non-console command never import prompt_toolkit. `worc top` is stdlib-only and needs nothing
# here. Install with `pip install wastech-orchestrator[shell]`.
shell = [
    "prompt_toolkit>=3",
]

[project.scripts]
wastech-orchestrator = "wastech_orchestrator.cli:main"
# `worc` is a short alias for the canonical `wastech-orchestrator` command; same entry point.
worc = "wastech_orchestrator.cli:main"

[tool.hatch.version]
# The version comes from the Git tag (e.g. tag `v0.1.1a1` -> version `0.1.0a1`). Between tags,
# builds get a dev version like `0.1.0a1.dev3+g<sha>`. Requires full history at build time
# (CI: actions/checkout with fetch-depth: 0). See docs/RELEASING.md.
source = "vcs"

[tool.hatch.build.targets.wheel]
# Non-.py files under the package (the aggregated `packaged/` tree — config example, built-in
# flows + role prompts, and the task-authoring guide, used by `init`) ship as package data.
packages = ["src/wastech_orchestrator"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "C4",       # existing
    "FA", "TID", "ISC", "ICN", "PIE", "RSE",     # structural correctness / readability
    "LOG", "G",                                   # logging discipline
    "DTZ",                                        # tz-aware datetime (locks in existing good behavior)
    "PTH",                                        # pathlib over os.path — cross-platform (coding-style.md)
    "PERF", "FURB",                               # perf + modern idioms
    "YTT", "ASYNC", "INP",                        # correctness
    "T20",                                        # no stray print() outside the presentation layer
    "RUF",                                        # ruff-specific (unused noqa, sorted __all__, …)
    # Phase-2 maintainability ratchets (thresholds below; current god-module offenders are baselined
    # in per-file-ignores as a burn-down backlog).
    "C901",                                       # cyclomatic complexity (mccabe)
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",   # too many returns / branches / args / statements
]
ignore = [
    # Intentional typographic/mathematical characters (en-dash "–", union "∪") in the Russian
    # comments and docstrings — not typos.
    "RUF001", "RUF002", "RUF003",
    "ISC001",  # conflicts with the formatter (Astral's recommendation when ruff format is used)
]

[tool.ruff.lint.per-file-ignores]
# The CLI / shell / install wizard legitimately write to stdout via print() — that is user-facing
# output, not logging. T20 stays on everywhere else (guards the core against a stray print).
# (cli.py / cli_shell.py also carry Phase-2 ratchet codes — see the backlog block below.)
"src/wastech_orchestrator/cli.py" = ["T20", "C901", "PLR0911", "PLR0912", "PLR0915"]
"src/wastech_orchestrator/cli_shell.py" = ["T20", "PLR0911", "PLR0913"]
"src/wastech_orchestrator/install/**" = ["T20"]
# Claude Code hook scripts print to stdout/stderr — that is how they talk to the harness, not logging.
".claude/**" = ["T20"]
# Tests: assert is the point; docstrings / magic values / private access / implicit namespace are
# test idioms. RUF059 (tuple-unpack where not every name is used) and PERF (runtime efficiency) are
# noise in test code, and the size/complexity ratchets target production maintainability, not tests.
"tests/**" = [
    "S101", "PLR2004", "SLF001", "INP001", "ARG", "D", "T20", "RUF059", "PERF",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
# --- Phase-2 ratchet baseline (burn-down backlog) -------------------------------------------------
# Each entry silences ONLY the size/complexity codes the file trips today, so new violations anywhere
# else are still caught. Remove a code as its function is refactored under the threshold.
"src/wastech_orchestrator/config/loader.py" = ["PLR0911"]
"src/wastech_orchestrator/core/decomposition.py" = ["PLR0911"]
"src/wastech_orchestrator/core/flow/checkers/citation.py" = ["PLR0911"]
"src/wastech_orchestrator/core/flow/engine.py" = ["PLR0913"]
"src/wastech_orchestrator/core/flow/engine_driver.py" = ["PLR0913"]
"src/wastech_orchestrator/core/flow/observability.py" = ["PLR0913"]
"src/wastech_orchestrator/core/flow/validator.py" = ["C901", "PLR0912", "PLR0915"]
"src/wastech_orchestrator/core/flow/wiring.py" = ["PLR0913"]
"src/wastech_orchestrator/core/orchestrator.py" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
"src/wastech_orchestrator/core/supervisor.py" = ["PLR0913"]
"src/wastech_orchestrator/memory/service.py" = ["PLR0913"]
"src/wastech_orchestrator/process_control.py" = ["PLR0913"]
"src/wastech_orchestrator/providers/_adapter_base.py" = ["PLR0913", "PLR0915"]
"src/wastech_orchestrator/providers/process.py" = ["PLR0915"]
"src/wastech_orchestrator/providers/codex.py" = ["C901", "PLR0912"]
"src/wastech_orchestrator/routing/router.py" = ["PLR0915"]
"src/wastech_orchestrator/security/injection.py" = ["PLR0911"]
"src/wastech_orchestrator/task/model.py" = ["PLR0911"]
"src/wastech_orchestrator/task/validation_gate.py" = ["C901", "PLR0911", "PLR0912"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # Phase-2 ratchet start; tighten toward 10 as the backlog burns down

[tool.ruff.lint.pylint]
max-args = 10        # Phase-2 ratchet start; tighten toward 5
max-branches = 15
max-returns = 6      # PLR0911 default
max-statements = 50  # PLR0915 default

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["^tests/"]

# prompt_toolkit is the optional [shell] extra — not installed for a headless `mypy src` run in CI,
# so tolerate its absence (imported lazily inside `worc shell`).
[[tool.mypy.overrides]]
module = "prompt_toolkit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` (pytest-xdist) fans the suite across CPU cores. The suite is process-spawn / I/O bound
# (hundreds of real git subprocesses per pipeline test), so parallelism is a large win — measured
# ~44 min -> ~11 min on a 12-core host. CI inherits this via `addopts` (it runs `pytest -q`). Use
# `-n0` for a serial run when debugging (`--pdb`, `-s` streaming, deterministic ordering).
addopts = "-q -n auto --strict-markers"
markers = [
    "slow: integration test that spawns real git/subprocesses or a real process tree (module-tagged; deselect with -m 'not slow' for a fast inner loop)",
]

# Docstring-coverage ratchet (run `interrogate src`). Floor set just below the current measured
# coverage (~70.8% with the ignores below); raise it as under-documented packages (notify, config,
# install) are filled in. Self-documenting Pydantic/dataclass models keep the target below 100.
[tool.interrogate]
fail-under = 70
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = true

# Dead-code gate (run `vulture`). Kept at high confidence: at 60% vulture floods with false positives
# on this Pydantic/enum/Protocol-heavy code (model fields, enum members, interface methods read
# dynamically). ignore_names covers params an external contract mandates (signal handlers, __exit__)
# that the body doesn't touch. The real ~60%-confidence dead-code candidates are left for a
# dedicated cleanup pass, not deleted blindly here.
[tool.vulture]
paths = ["src"]
min_confidence = 80
ignore_names = ["signum", "frame", "exc_type", "exc_val", "exc_tb", "tb"]

# Dependency hygiene (run `deptry src`). The dev/docs extras are tooling that src never imports, so
# they are declared dev-only rather than flagged unused; the `shell` extra (prompt_toolkit) is a real
# lazily-imported optional runtime dep and stays a normal optional dependency.
[tool.deptry]
optional_dependencies_dev_groups = ["dev", "docs"]
