# Example configuration for wastech-orchestrator.
# Copy to config.yaml and fill it in for your project. config.yaml is NOT committed to git.

schema_version: 15                  # config format version; the orchestrator refuses newer configs

orchestrator:
  auto_mode:
    enabled: false                  # when true, pick the next pending task after terminal cleanup
  poll_interval_seconds: 300        # `watch` tick: fetch/pull base_branch to discover git-pushed
                                    # tasks, then process pending. 0 = single-pass (no loop, no sync)

repo:
  url: "git@github.com:OWNER/REPO.git"
  local_path: "./workspace/repo"
  base_branch: "main"
  branch_prefix: "agent"            # task branches: agent/<task-id>-<slug>

agents:
  allowed:
    - claude
    - codex

  max_stage_attempts: 3
  max_fix_cycles: 15
  max_total_fix_iterations: 30      # hard global cap across all fix loops (and all subtasks); >= max_fix_cycles

  allow_review_skip: false          # required before a task's `stages.review.enabled: false` may disable the `review` quality gate

  decomposition:                    # optional task decomposition (§5.1); OFF by default
    enabled: false
    max_subtasks: 8                 # a split with n > this (or n < 2) is rejected; runs as a single task

  # Provider routing is node-based: a flow node declares its own `provider` (else the global
  # primary below). Exactly one configured provider must set `primary: true` — it runs every node
  # with no `provider` field and is the sole infrastructure-fallback target. It must be in `allowed`.
  # `model`/`reasoning` below are explicit defaults; blank either ("" / null) to use the CLI default.
  # Full access — Codex `sandbox: danger-full-access` or Claude `--permission-mode bypassPermissions`
  # in `extra_args` — is operator-selectable but rejected at preflight unless `strict_isolation: false`.
  providers:
    claude:
      command: "claude"
      model: "claude-sonnet-4-6"   # "" = use the Claude CLI/account default
      reasoning: high          # low | medium | high | xhigh | max
      timeout_seconds: 7200
      max_turns: 50
      permission_profile: "workspace-write"
      extra_args: []
      primary: true            # the global primary (exactly one provider; must be in `allowed`)
    codex:
      command: "codex"
      model: "gpt-5.4"         # confirm against your Codex CLI; "" = use its default
      reasoning: high          # low | medium | high | xhigh | max->xhigh
      timeout_seconds: 7200
      sandbox: "workspace-write"   # workspace-write | read-only | danger-full-access (needs strict_isolation: false)
      permission_profile: "workspace-write"
      extra_args: []

security:
  strict_isolation: true
  allowed_environment:
    - "PATH"
    - "HOME"
    - "USERPROFILE"
    - "CODEX_HOME"
    - "CLAUDE_CONFIG_DIR"
  denied_read_paths:
    - ".env"
    - "secrets/**"
  denied_commands:                    # REPLACES (does not extend) the default list — keep every entry you need
    - "git commit"
    - "git push"
    - "gh pr create"
    - "gh pr merge"

validation:                         # input hardening gate (§19); rejects broken tasks before any branch
  max_task_bytes: 262144
  max_task_lines: 5000
  max_line_bytes: 8192
  max_control_ratio: 0.01
  required_fields: ["id", "title"]
  reject_unknown_fields: true
  quarantine_folder: "./.worc/tasks/rejected"

checks:
  # Named per-project command sets (monorepo-ready). Empty / omitted = NO quality gate (every task
  # passes the checks node). The runner runs the union of sets whose `paths` glob the task diff; a
  # set with no `paths` always runs (on any non-empty diff); an empty diff runs nothing. Each command
  # runs as an argv list (no shell) in its `cwd`. No commands are auto-discovered — you author this.
  command_sets: {}
  #
  # --- Single-root repo: one set, no `paths` (runs on any change) ---
  # command_sets:
  #   default:
  #     commands:
  #       - { name: tests, argv: [pytest] }
  #       - { name: lint,  argv: [ruff, check, .] }
  #       - { name: types, argv: [mypy, src] }
  #
  # --- Polyglot monorepo: one set per project, selected by the diff path ---
  # command_sets:
  #   backend:
  #     paths: ["backend/**"]
  #     commands:
  #       - { name: backend-tests, argv: [dotnet, test], cwd: backend/src }
  #   frontend:
  #     paths: ["mobile/**"]
  #     commands:
  #       - { name: fe-lint,  argv: [npm, run, lint], cwd: mobile }
  #       - { name: fe-tests, argv: [npm, test],      cwd: mobile }
  #   docs:                                 # extension glob: runs only when Markdown changes
  #     paths: ["**/*.md"]
  #     commands:
  #       - { name: md-lint, argv: [wastech-ctxlint] }
  #   ios:
  #     paths: ["ios/**"]
  #     timeout_seconds: 2400                 # overrides the global per-command timeout below
  #     skip_if_unavailable: true             # no xcodebuild on host -> skip (loud), don't fail task
  #     commands:
  #       - { name: ios-tests, argv: [xcodebuild, test, "-scheme", App], cwd: ios }
  timeout_seconds: 7200             # global per-command timeout (argv, no shell); per-set overrides

git:
  create_pull_request: true
  pr_base: "main"
  # ⚠️  DANGER: auto-merge bypasses the human review gate — the last defence against shipping a wrong
  #     or malicious agent diff. All four keys default to the safe value; enable only with protected
  #     branches + required CI status checks already enforcing your quality gate. The mid-pipeline
  #     dangerous-diff approval still fires; auto-merge only affects the publish step.
  auto_merge: false                 # true: merge every published PR to pr_base automatically
  auto_merge_strategy: squash       # merge | squash | rebase  (used when a merge fires)
  auto_merge_wait_for_checks: false # true: arm GitHub-native auto-merge (--auto) — merge only after required checks pass
  # NOTE: a per-task `auto_merge: true|false` wins outright over this default (PRE.2). Auto-merge
  # skips the human PR review — the operator (the task author) owns that call; see docs/operations.md.
  footprint:                        # audit-trail policy (§21). Runtime files always live under the
                                    # gitignored <repo>/.worc/ home; only the task file and its
                                    # <id>.summary.md are committed, at the repo root under tasks/.
    audit_commit_message: "chore(orchestrator): audit trail for {task_id}"
    audit_on_branch: task           # task | sibling

telegram:                           # human-in-the-loop + notifications (optional)
  enabled: false
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"   # must resolve to a non-zero numeric chat id
  ask_timeout_s: 28800              # > 0; blocking HITL fails closed on timeout

# Prompt templates are not configured here: a flow node's prompt is the content of its `role_file`
# (packaged flow roles, or `.worc/flows/roles/*.md` for an operator flow). Edit the role file to
# customize a node's prompt. Role files render only allowlisted path/metadata variables ({task_id}
# {stage} {repo_path} {task_path} {plan_path} {diff_path} {checks_path} {review_path} {skills_path}
# {subtask_order} {subtask_count} {subtask_spec_path}) — never task bodies, diffs, env, or secrets.

skills:                             # planning-selected repo skill references (optional, §2.1)
  scan_root: ""                     # empty = <repo.local_path>/.claude/skills (the target repo's skills)
  exclude:                          # gate-duplicating skills withheld from planning (orchestrator owns them)
    - "run-checks"
    - "test"
    - "sync-docs"
  # At task start the orchestrator scans <scan_root>/*/SKILL.md (name+description only). The planning
  # stage may pick relevant ones; chosen SKILL.md files reach implementation/fixing as read-only
  # reference paths (never executed, never the Claude Skill tool — Codex has none).

supervisor:                          # constant oversight layer above any flow — always active (§P2.1)
  role_file: "roles/supervisor.md"  # role prompt for the supervisor; path-contained under roles/
  model: null                       # null = use the global primary provider's default model
  reasoning: null                   # null = use the global primary provider's default reasoning

prompt_audit: false                 # record each step's prompt + who (provider/model/attempt/fallback/
                                    # status) under logs/<task-id>/prompt-audit/, in chronological order.
                                    # A per-task `prompt_audit: true|false` always overrides this (task wins).
