# Example configuration for wastech-orchestrator.
# Copy to config.yaml and fill it in for your project. config.yaml is NOT committed to git.

schema_version: 4                   # config format version; the orchestrator refuses newer configs

orchestrator:
  auto_mode:
    enabled: false                  # when true, pick the next pending task after terminal cleanup
  poll_interval_seconds: 300        # `watch` tick: fetch/pull base_branch to discover git-pushed
                                    # tasks, then process pending. 0 = single-pass (no loop, no sync)

repo:
  url: "git@github.com:OWNER/REPO.git"
  local_path: "./workspace/repo"
  base_branch: "main"
  branch_prefix: "agent"            # task branches: agent/<task-id>-<slug>

agents:
  allowed:
    - claude
    - codex

  max_stage_attempts: 3
  max_fix_cycles: 15
  max_total_fix_iterations: 30      # hard global cap across all fix loops (and all subtasks); >= max_fix_cycles

  skip_stages: []                   # stages skipped for every task: any of [planning, testing, review, fixing, summary]
  allow_review_skip: false          # required before any task (or skip_stages) may disable the `review` quality gate

  decomposition:                    # optional task decomposition (§5.1); OFF by default
    enabled: false
    max_subtasks: 8                 # a split with n > this (or n < 2) is rejected; runs as a single task
    min_size_signal: "large"        # advisory threshold passed to the planning prompt
    commit_per_subtask: true        # one local commit per subtask on the single task branch

  routing:                          # primary/fallback per stage
    refinement:
      primary: claude
      fallback: codex
    planning:
      primary: claude
      fallback: codex
    implementation:
      primary: claude
      fallback: codex
    review:
      primary: codex
      fallback: claude
    fixing:
      primary: claude
      fallback: codex
    summary:
      primary: claude
      fallback: codex

  providers:
    claude:
      command: "claude"
      model: ""
      reasoning: null          # low | medium | high | xhigh (Opus 4.7+ / Fable 5) | max
      timeout_seconds: 7200
      max_turns: 50
      max_budget_usd: null
      permission_profile: "workspace-write"
      extra_args: []
    codex:
      command: "codex"
      model: ""
      reasoning: null          # low | medium | high | xhigh | max->xhigh
      timeout_seconds: 7200
      sandbox: "workspace-write"
      permission_profile: "workspace-write"
      extra_args: []

security:
  strict_isolation: true
  allowed_environment:
    - "PATH"
    - "HOME"
    - "USERPROFILE"
    - "CODEX_HOME"
    - "CLAUDE_CONFIG_DIR"
  denied_read_paths:
    - ".env"
    - "secrets/**"
  denied_commands:
    - "git commit"
    - "git push"
    - "gh pr create"

validation:                         # input hardening gate (§19); rejects broken tasks before any branch
  max_task_bytes: 262144
  max_task_lines: 5000
  max_line_bytes: 8192
  max_control_ratio: 0.01
  required_fields: ["id", "title"]
  reject_unknown_fields: true
  quarantine_folder: "./tasks/rejected"

checks:
  discovery:
    mode: configured                # auto | deterministic | configured | disabled (see docs/configuration.md)
    refresh: on_change              # on_change | always | never — when a cached profile is recomputed
  commands:                         # legacy strings and/or structured {name, argv}; non-empty wins in any mode
    - "npm test"
    - "npm run lint"
  timeout_seconds: 7200             # per-command timeout for the Check Runner (argv list, no shell)

git:
  create_pull_request: true
  pr_base: "main"
  # ⚠️  DANGER: auto-merge bypasses the human review gate — the last defence against shipping a wrong
  #     or malicious agent diff. All four keys default to the safe value; enable only with protected
  #     branches + required CI status checks already enforcing your quality gate. The mid-pipeline
  #     dangerous-diff approval still fires; auto-merge only affects the publish step.
  auto_merge: false                 # true: merge every published PR to pr_base automatically
  auto_merge_strategy: squash       # merge | squash | rebase  (used when a merge fires)
  auto_merge_allow_per_task: false  # true: honor a per-task `auto_merge: true` (a per-task false always opts out)
  auto_merge_wait_for_checks: false # true: arm GitHub-native auto-merge (--auto) — merge only after required checks pass
  footprint:                        # where orchestration/task artifacts live vs. the target repo (§21)
    location: in_repo               # external | in_repo  (in_repo: tasks/ & logs/ live in the repo)
    tracking: commit                # none | exclude_local | commit  (commit: audit-commit tasks/ only)
    external_root: "./"             # location=external only: where tasks/ & logs/ live, OUTSIDE the clone
    audit_commit_message: "chore(orchestrator): audit trail for {task_id}"  # tracking=commit only
    audit_on_branch: task           # task | sibling   (tracking=commit only)

telegram:                           # human-in-the-loop + notifications (optional)
  enabled: false
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"   # must resolve to a non-zero numeric chat id
  ask_timeout_s: 28800              # > 0; blocking HITL fails closed on timeout

prompts:                            # operator-customizable stage prompts (optional; schema v3)
  templates_dir: "./templates/prompts"  # resolves from the orchestrator project root, not the repo
  mode: append                      # append (default + your text) | replace (your text only)
  strict: false                     # true = a missing override file is a config error; false = warn + default
  overrides: {}                     # map an agent-routed stage to a .md file inside templates_dir, e.g.:
                                    #   implementation: "implementation.md"
                                    #   review: "review.md"
                                    # Templates are prompt text only; they cannot change provider,
                                    # extra_args, sandbox/approvals, denied commands/reads, or env.
                                    # Variables: {task_id} {stage} {repo_path} {task_path} {plan_path}
                                    #   {diff_path} {checks_path} {review_path} {subtask_order}
                                    #   {subtask_count} {subtask_spec_path} (paths/metadata only).
