site_name: Wastech Orchestrator
site_description: A lean orchestrator that turns Markdown tasks into reviewed pull requests.
site_url: https://vladimirmakarevich.github.io/wastech-orchestrator/
repo_url: https://github.com/VladimirMakarevich/wastech-orchestrator
repo_name: ''
edit_uri: ''
docs_dir: .site-src
site_dir: site
strict: true

theme:
  name: mkdocs
  locale: en
  navigation_depth: 4

extra_css:
  - assets/retro.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - assets/mermaid-init.js
  - assets/copy-code.js

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: "#"

nav:
  - Home: index.md
  - Getting Started:
      - How It Works: how-it-works.md
      - Operations: operations.md
      - Cookbook: cookbook.md
      - How-To: how-to.md
      - Glossary: glossary.md
  - Reference:
      - Configuration: configuration.md
      - Task Authoring: task-authoring.md
      - Flow Authoring: flow-authoring.md
      - Telegram: telegram.md
  - Architecture:
      - Architecture Overview: worc_architecture.md
