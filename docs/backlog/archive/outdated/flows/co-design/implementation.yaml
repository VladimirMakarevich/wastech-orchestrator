# Эталонный flow `implementation` (co-design, Step 0). Целевое состояние v1.
# Финальная форма контракта: ключ исхода ребра `outcome` (не `on` — YAML 1.1 bool-ловушка),
# условный пропуск узла — предикат `when`, decomposition — отдельный блок.
#
# Ревизия 2026-06-19: supervisor — НЕ узел графа, а константный слой оркестратора над любым
# flow (summary + терминальный advisory-контроль, config.yaml: supervisor). Узлы supervise_impl/
# supervise_fix и summary-узел убраны; блокирующие пер-стейдж гейты = опциональные review/
# test_quality-узлы. См. flow-contract.md §2.2/§7, p2-implementation.md §P2.1.
flow:
  name: implementation
  task_type: implementation
  permission_ceiling: workspace-write
  output_policy: code_change
  publishing: pull_request

  defaults:
    evaluator:
      session_scope: fresh_disposable
      permission_profile: read-only
      max_rework_per_stage: 1

  nodes:
    - id: refinement
      kind: agent
      role_file: roles/refinement.md
      session_scope: fresh_disposable
      permission_profile: read-only
      hitl: { allow_question: true, allow_approval: false }
      when: { fact: derived.needs_refinement }
    - id: planning
      kind: agent
      role_file: roles/planning.md
      session_scope: fresh_disposable
      permission_profile: read-only
      hitl: { allow_question: true, allow_approval: true }
    - id: implementation
      kind: agent
      role_file: roles/implementation.md
      session_scope: editing_lineage
      permission_profile: workspace-write
    - id: testing_quality
      kind: evaluator
      role: test_quality
      role_file: roles/testing.md
      session_scope: fresh_disposable
      permission_profile: read-only
      blocking: false
      max_rework_per_stage: 1
      when: { fact: config.hybrid_testing }
    - id: testing
      kind: checks
      checker: command_profile
      discovery: { mode: auto, approve_command_changes: true }
    - id: review
      kind: evaluator
      role: review
      role_file: roles/review.md
      session_scope: fresh_disposable
      permission_profile: read-only
    - id: fixing
      kind: agent
      role_file: roles/fixing.md
      session_scope: editing_lineage
      lineage_affinity: implementation
      permission_profile: workspace-write
    - id: publish
      kind: publish
      policy: pull_request
    # supervise_impl/supervise_fix/summary-узлов нет: summary + терминальный контроль
    # даёт константный supervisor-слой оркестратора перед publish (config.yaml: supervisor).

  edges:
    - { from: refinement, to: planning }
    - { from: planning, to: implementation }
    - { from: implementation, to: testing_quality }
    - { from: testing_quality, to: testing, outcome: accept }
    - { from: testing_quality, to: fixing, outcome: rework, budget: 1 }
    - { from: testing, to: review, outcome: pass }
    - { from: testing, to: fixing, outcome: fail, loop: test_fix }
    - { from: review, to: publish, outcome: accept }
    - { from: review, to: fixing, outcome: rework, loop: review_fix }
    - { from: fixing, to: testing_quality }

  budgets:
    global_fix_iterations: 30
    test_fix: 15
    review_fix: 15

  decomposition:
    proposed_by: planning
    gate: { min: 2, max: 8, linear_depends_on: true }
    sub_flow: [implementation, testing_quality, testing, review, fixing]
    commit_each_subtask: true
    shared_budget: global_fix_iterations
