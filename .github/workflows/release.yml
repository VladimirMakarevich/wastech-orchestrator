name: release

# Cut a (pre)release when a version tag is pushed. The package version is derived from the tag by
# hatch-vcs (e.g. tag `v0.1.1a1` -> version `0.1.0a1`); tags ending in aN/bN/rcN are marked as a
# GitHub pre-release. Release notes are auto-generated from merged PRs/commits.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write          # required to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    # The tag is resolved once here and reaches every step as an environment variable. It must NEVER
    # be interpolated as `${{ … }}` inside a `run:` block: on workflow_dispatch it is caller-supplied
    # text, and `${{ }}` is substituted into the script before the shell sees it, so a crafted value
    # would execute as shell code.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so hatch-vcs can resolve the version

      # Releases are cut from `release` only (see .agents/rules/git-workflow.md §A). A tag pushed
      # from `dev` or a feature branch would ship a tree that never went through integration, so
      # refuse it rather than publish it. `fetch-depth: 0` above makes the ref data available.
      - name: Assert the tag is on the release branch
        run: |
          git branch -r --contains "$TAG" | grep -qE '^\s*origin/release$' \
            || { echo "::error::$TAG does not point at a commit on origin/release"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (with dev deps) and gate on the quality checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy src
          lint-imports
          interrogate src
          vulture
          deptry src
          pytest -q

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Create the GitHub (pre)release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          PRE=""
          # aN / bN / rcN suffix (PEP 440 pre-release) -> mark as a GitHub pre-release.
          if echo "$TAG" | grep -qE '(a|b|rc)[0-9]+$'; then PRE="--prerelease"; fi
          gh release create "$TAG" dist/* $PRE --title "$TAG" --generate-notes
