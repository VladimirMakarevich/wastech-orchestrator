name: main-guard

# Machine check for the transition that silently bypasses the three-branch model
# (see .agents/rules/git-workflow.md §A). `main` takes code only through `dev`, documentation
# through `docs/…`, and a published hotfix back through `release`. Nothing else may target it.
#
# This needs enforcing rather than trusting because the failure is invisible: a `feat/…` branch
# pointed straight at `main` merges *cleanly* — the merge base is already docs-less, so no
# deletion is proposed and no conflict is raised — and the only symptom is that `dev` silently
# falls behind `main`. That is exactly how PR #48 landed on `main` instead of `dev`.
#
# The other half of the guard lives in repository settings, not here: a ruleset on `main`
# restricts the merge method to a merge commit. The method is chosen at merge time, after every
# check has already reported, so no pull-request check can ever see it.
#
# Runs only on pull requests targeting `main`, so it is inert on `dev` / `release` work.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: main-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: main branch invariants
    runs-on: ubuntu-latest
    steps:
      # No checkout: the source branch name is the whole input. Branch names are
      # attacker-influenced strings, so it reaches the shell through `env`, never through
      # `${{ }}` interpolation inside `run`.
      - name: Reject a source branch that bypasses dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev | release | docs/*)
              echo "PR source '$HEAD_REF' is a legal transition into main."
              ;;
            *)
              echo "::error::'$HEAD_REF' may not be merged into main. Code reaches main only through 'dev' (merge commit), derived documentation through 'docs/…', a published hotfix through 'release'. Retarget this PR at 'dev' (see .agents/rules/git-workflow.md §A)."
              exit 1
              ;;
          esac
