name: site

# Build and publish the Markdown documentation site. This workflow, `mkdocs.yml`, and
# `tools/stage_site_docs.py` exist on the `site` branch alone — it is the only branch that carries
# the derived docs/ tree they read (see .agents/rules/git-workflow.md §A), and `mkdocs.yml` sets
# `strict: true`, so a run anywhere else would fail on missing files.
#
# Publication is a push to `site`: merging `main → site` republishes, and so does landing a
# `docs/…` pull request. A pull request into `site` builds without deploying, so a broken link or a
# nav entry with no page is caught before it is published. The output is plain static files and can
# move off Pages later.
on:
  push:
    branches: ["site"]
  pull_request:
    branches: ["site"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # `--ref site` is pinned rather than taken from GITHUB_REF_NAME: on a pull_request the ref name
      # is `<n>/merge`, which would bake nonsense blob URLs into every link that points outside the
      # published page set. The site only ever publishes from this branch, so the ref is a constant.
      - name: Stage Markdown docs
        run: python tools/stage_site_docs.py --ref site

      - name: Build static site
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
