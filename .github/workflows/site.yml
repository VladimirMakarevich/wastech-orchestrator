name: site

# Build the Markdown documentation site on the branches that carry documentation, but publish it only
# when a release/pre-release tag is pushed. The output is plain static files and can move off Pages
# later.
#
# Restricted to `main` / `release` on purpose: `dev` carries no derived docs/ tree (see
# .agents/rules/git-workflow.md §A), while `tools/stage_site_docs.py` copies a fixed list of
# docs/*.md and mkdocs.yml sets `strict: true` — so a run against a `dev` ref, or a `feat/… -> dev`
# pull request, would fail on missing files.
#
# `tags: ["v*"]` is required, not decorative: a `push` trigger that specifies `branches` does not fire
# on tag pushes at all, so without it the tag-gated deploy job below is unreachable and only
# workflow_dispatch can publish. Release tags are cut on `release`.
on:
  pull_request:
    branches: ["main", "release"]
  push:
    branches: ["main", "release"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Stage Markdown docs
        run: python tools/stage_site_docs.py --ref "${GITHUB_REF_NAME:-main}"

      - name: Build static site
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
