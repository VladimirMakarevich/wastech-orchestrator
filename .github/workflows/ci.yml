name: ci

# Run the quality gate (ruff, ruff format, mypy, pytest) on every pull request and on pushes to
# main, so regressions are caught before a release tag is cut. Mirrors the gate in release.yml.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run (saves CI minutes; the latest commit wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the declared floor (requires-python = ">=3.12") plus the next minor.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy src

      - name: Import contracts (import-linter)
        run: lint-imports

      - name: Docstring coverage (interrogate)
        run: interrogate src

      - name: Dead code (vulture)
        run: vulture

      - name: Dependency hygiene (deptry)
        run: deptry src

      - name: Tests (pytest)
        run: pytest -q
