name: ci

# Quality gate on every pull request and on pushes to any long-lived branch (dev / main / release).
# `dev` matters most: all real work merges there, so without it in the push list those merge commits
# would run no CI at all outside of pull requests. Only the `markdown` job reads docs/, and it needs
# no branch handling: it lints whatever the checkout contains, so the docs-less `dev` tree and the
# documentation-carrying branches are covered by the same step (see .agents/rules/git-workflow.md §A).
#
# WRI-006 (cross-platform isolation verification): cross-platform behaviour is a hard repository
# invariant, so the deterministic test suite — which exercises provider command generation, the typed
# layout, exchange publication, lifecycle sealing/restoration, redaction, and security validation —
# runs NATIVELY on Windows, macOS, and Linux (the `test` matrix below), not only Ubuntu. The static
# gates (ruff/mypy/import-linter/interrogate/vulture/deptry) stay on Ubuntu: runtime parity is proven
# by the three-OS `test` matrix, so re-running lint/format on every OS would add cost without adding
# signal.
#
# The deterministic suite injects the platform/path seams (`system=`, the Codex profile `to_native=`
# renderer, the Claude `SandboxCapability` probe) AND runs the real filesystem tests natively on each
# runner. It never authenticates to a model provider or spends tokens. The real host-enforcement
# smokes (`codex sandbox` / Claude's Bash sandbox) need the actual CLIs, which hosted GitHub runners
# do not ship; those smokes are skip-gated (`shutil.which` guards in tests/providers/*_smoke.py) and
# are run locally / manually + surfaced to operators by `worc preflight`'s no-model capability smoke.
# WSL2 is the Linux policy branch and is likewise covered by a documented local/manual smoke — see
# docs/operations.md. This keeps ordinary CI deterministic and credential-free.
on:
  pull_request:
  push:
    branches: ["main", "dev", "release"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run (saves CI minutes; the latest commit wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static gates (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy src

      - name: Import contracts (import-linter)
        run: lint-imports

      - name: Docstring coverage (interrogate)
        run: interrogate src

      - name: Dead code (vulture)
        run: vulture

      - name: Dependency hygiene (deptry)
        run: deptry src

  markdown:
    name: markdown context (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The linter is a separate repository and is not published to npm, so the gate builds it from
      # source. Two properties are load-bearing. The ref is a commit SHA, not a branch: a moving ref
      # would let an upstream change turn this build red without a commit here. And the checkout goes
      # to the runner's temp directory rather than into the workspace — the linter's own repository
      # carries ~150 Markdown files, and any path inside the workspace would put them in the corpus
      # this job is meant to measure.
      - name: Check out the Markdown linter
        uses: actions/checkout@v4
        with:
          repository: VladimirMakarevich/wastech-mdlint
          ref: 3317157d1464515a85209deab5cc33089f89b497
          path: ${{ runner.temp }}/wastech-mdlint

      - uses: actions/setup-node@v4
        with:
          # The linter's engines floor. Its own install is engine-strict, so an older runner default
          # would fail the install rather than warn.
          node-version: "24.17.x"
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/wastech-mdlint/package-lock.json

      - name: Build the linter
        working-directory: ${{ runner.temp }}/wastech-mdlint
        run: |
          npm ci
          npm run build

      # One command for CI, the hook, and the shell, so a contributor cannot see a different corpus
      # than the build does. It runs the shared config plus every additive config present in the
      # checkout, which is how the branch that carries the derived documentation gets its extra rules
      # without this workflow knowing which branch it is on. `CI` is set by Actions, so a linter it
      # cannot find fails here instead of skipping the way it does locally.
      - name: Markdown gate (wastech-mdlint)
        env:
          WASTECH_MDLINT_HOME: ${{ runner.temp }}/wastech-mdlint
        run: python3 tools/mdlint.py

  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows / macOS / Linux are all required isolation jobs (WRI-006). Ubuntu also covers the
        # declared Python floor (requires-python = ">=3.12") plus the next minor; macOS (the priciest
        # runner) and Windows run the primary version — enough to prove native cross-platform parity
        # without doubling the most expensive minutes.
        include:
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (pytest)
        run: pytest -q
