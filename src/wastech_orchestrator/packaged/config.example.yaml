# Example configuration for wastech-orchestrator.
# Copy to config.yaml and fill it in for your project. config.yaml is NOT committed to git.
# This is the packaged copy used by `wastech-orchestrator init` (the only example config; nothing else to sync).

schema_version: 36                  # config format version; the orchestrator refuses newer configs

orchestrator:
  auto_mode:
    enabled: false                  # when true, pick the next pending task after terminal cleanup
    confirm_next_task: false        # when true, ask approve/deny in Telegram before claiming each
                                    # pending task; deny/timeout stops chaining (requires telegram)
  poll_interval_seconds: 300        # `watch` tick: fetch/pull base_branch to discover git-pushed
                                    # tasks, then process pending. 0 = single-pass (no loop, no sync)
  queue: "default"                  # this instance's queue selector: only pick tasks whose `queue`
                                    # equals this (string equality). Lets several worc instances share
                                    # one task pool without colliding. Override per launch: --queue

repo:
  url: "git@github.com:OWNER/REPO.git"
  local_path: "./workspace/repo"
  base_branch: "main"               # branch tasks fork from and PRs target by default
  branch_prefix: "worc"             # task branches: worc/<task-id>-<slug>
  branch_mode: "new"                # default target for task git ops: new | existing | current
                                    #   (a per-task `branch_mode` overrides this)
  # checkout_base_on_cleanup:       # return the working tree to base_branch after a terminal
                                    #   outcome. Omit/null = per branch_mode (new returns; existing
                                    #   and current stay on the branch). false = never return (a
                                    #   global off switch, incl. new). true = force new + existing
                                    #   to return. current always stays regardless.

paths:                              # where the task lifecycle lives (optional; omit = defaults)
  tasks_dir: "tasks"                # repo-relative dir holding preparing/pending/done/failed.
                                    # `preparing/` is the staging area the watch scanner never looks
                                    # in — compose a task there, then `worc promote` it into pending.
                                    # Rename to avoid clashing with a repo that already uses tasks/.
                                    # Must be repo-relative (no .. / absolute) and NOT under .worc/
                                    # (that home is gitignored — the audit trail would be lost). The
                                    # lifecycle subfolder names are fixed. `install` only scaffolds
                                    # the default tasks/; for another name, create its subfolders.

agents:
  allowed:                            # providers this instance may launch; must include the primary
    - claude
    - codex

  max_stage_attempts: 3             # provider attempts for ONE node before the stage fails, counting
                                    #   the cross-provider fallback hop (separate from agents.retry below)
  max_fix_cycles: 15                # max iterations of ONE fix loop (e.g. review/test -> fixing -> back)
  max_total_fix_iterations: 30      # hard global cap across all fix loops (and all subtasks); >= max_fix_cycles

  decomposition:                    # optional task decomposition; OFF by default
    enabled: false
    max_subtasks: 8                 # a split with n > this (or n < 2) is rejected; runs as a single task

  retry:                            # optional: transient provider-failure recovery; safe defaults
    max_attempts: 2                 # same-provider retries AFTER the first attempt (per provider); 0 disables
    base_delay_s: 2.0               # exponential backoff: min(base * 2**k, max_delay_s), no jitter
    max_delay_s: 30.0               # cap per-retry delay (total retry window stays well under a minute)
    max_blocked_s: 21600.0          # any provider down OR rate-limited -> park as resumable; fail only after
                                    #   this much total parked time (6h > a provider's ~5h usage window).
                                    #   "Any" is literal: the decision reads the error class of EVERY
                                    #   attempt in the stage, so a fallback that fails worse than the
                                    #   primary cannot turn a park into a terminal failure.
                                    #   A provider that reports when its own limit window reopens
                                    #   SHORTENS the wait within this ceiling (the task idles until
                                    #   then instead of retrying every poll); the ceiling still wins

  # Provider routing is node-based: a flow node declares its own `provider` (else the global
  # primary below). Exactly one configured provider must set `primary: true` — it runs every node
  # with no `provider` field and is the sole infrastructure-fallback target. It must be in `allowed`.
  # `model`/`reasoning` below are explicit defaults; blank either ("" / null) to use the CLI default.
  # Full access — Codex `sandbox: danger-full-access` or Claude `--permission-mode bypassPermissions`
  # in `extra_args` — is operator-selectable but rejected at preflight unless `strict_isolation: false`.
  providers:
    claude:
      command: "claude"       # executable name (found on PATH) or an absolute path to the CLI
      model: "claude-sonnet-5"   # "" = use the Claude CLI/account default
      reasoning: high          # low | medium | high | xhigh | max
      timeout_seconds: 7200    # per-attempt CLI wall-clock ceiling (seconds)
      max_turns: 400           # Claude turn cap (positive int); "none" or "max" = no cap (unlimited)
      max_turns_gate: false    # when true, hitting max_turns pauses for a Telegram continue/stop
                               # prompt (requires telegram); a low cap (~50–100) is then safe
      # allow_native_memory: false  # OPT-IN RISK — when true, drops the deny that confines Claude
                               # Code's own auto-memory (~/.claude/projects/<repo>/memory/), letting
                               # it persist across tasks. That store is OUTSIDE the orchestrator's
                               # redaction net and audit; leave off unless you accept that. This is
                               # the ONLY switch that makes it writable (disable_read_isolation
                               # below lifts only reads), and each run then logs
                               # "native Claude memory ON". Claude-only.
      permission_profile: "workspace-write"   # read-only | workspace-write (a flow node's ceiling may lower it)
      extra_args: []           # raw CLI flags appended verbatim; forbidden ones fail preflight
      primary: true            # the global primary (exactly one provider; must be in `allowed`)
    codex:
      command: "codex"        # executable name (found on PATH) or an absolute path to the CLI
      model: "gpt-5.4"         # "" = use the Codex CLI/account default
      reasoning: high          # minimal | low | medium | high | xhigh | max->xhigh
      timeout_seconds: 7200    # per-attempt CLI wall-clock ceiling (seconds)
      permission_profile: "workspace-write"   # read-only | workspace-write — codex's isolation knob:
                               # a generated permission profile grants only this level, denies the
                               # private/control homes + secrets + CODEX_HOME, and keeps the exchange
                               # read-only, proven by a no-model `codex sandbox` canary before each run
      # sandbox: "danger-full-access"   # OPT-OUT: removes codex isolation; loads only under
                               # `strict_isolation: false` (you own the risk). read-only/workspace-write
                               # are NOT valid here anymore — use permission_profile above.
      extra_args: []           # raw CLI flags appended verbatim; forbidden ones fail preflight

security:
  strict_isolation: true              # fail-closed sandbox (default). Full-access provider modes —
                                      #   Codex `sandbox: danger-full-access`, Claude `--permission-mode
                                      #   bypassPermissions` in extra_args — are REJECTED at preflight,
                                      #   and any provider whose required isolation can't be enabled
                                      #   fails preflight (no silent downgrade). Set false ONLY to
                                      #   consciously opt into full access (you then own the risk); the
                                      #   absolutely-forbidden flags (--dangerously-skip-permissions,
                                      #   --yolo, --ignore-rules) stay banned regardless.
  disable_read_isolation: true        # DEFAULT true — read-isolation is OFF out of the box (set
                                      #   false to KEEP it on). true disables READ-isolation for
                                      #   provider runs: Claude reloads native
                                      #   CLAUDE.md + project settings/hooks/MCP/skills (via
                                      #   --setting-sources project) and Codex reloads the user +
                                      #   project .codex config/hooks/rules; the PRIVATE read-deny
                                      #   projection (.worc/env-file/provider homes/frozen bundles)
                                      #   is lifted. The WRITE side stays (exchange/.git/tasks write-
                                      #   deny, commit/staging gates, PR control) and the
                                      #   denied_read_paths blacklist stays enforced. strict_isolation
                                      #   is the master switch: strict_isolation: false forces this on
                                      #   regardless. Operator-config ONLY (never a task/flow/extra_args
                                      #   key). `worc preflight` prints `read-isolation: OFF` when in
                                      #   effect — never a silent weakening. Native Windows Codex
                                      #   needs the elevated sandbox backend when read-isolation is
                                      #   ON; without it preflight/the pre-launch canary fails closed.
  allow_git_evidence: false           # DEFAULT false. Master switch for the read-only git-evidence
                                      #   grant: a flow node that declares `git_evidence: true` may
                                      #   run the read-only git verbs (log, show, diff, blame,
                                      #   status, rev-list, rev-parse, ls-files, shortlog, describe,
                                      #   cat-file, for-each-ref) so an audit node can cite a commit
                                      #   instead of grepping a changelog for delivery history.
                                      #   While this is false a declaring flow still loads and
                                      #   validates — it just runs exactly as it does today, with no
                                      #   shell. Turning it on does NOT make the node writable: the
                                      #   sandbox write-denies the whole clone (Claude) / forbids
                                      #   every mutation outright (Codex), denied_commands stays the
                                      #   floor, and commit/push/PR remain the orchestrator's alone.
                                      #   Operator-config ONLY (never a task/flow/extra_args key).
  allowed_environment:                  # REPLACES (does not extend) the default — keep the OS-launch
                                        # essentials for YOUR OS or the spawned CLI may fail to start.
                                        # A name absent from the host OS is simply skipped, so the
                                        # cross-platform union below is safe to keep as-is on any OS.
                                        # This TEMPLATE ships the union (22 names); the config.yaml
                                        # `worc install` generates carries only the host OS default
                                        # (9 names on Linux/macOS, 19 on Windows), and
                                        # `worc upgrade-config` merges from this template. Two names
                                        # are checked for you: `PATH` is mandatory (a config without
                                        # it is a load error) and on Windows `SystemRoot` is a
                                        # `worc preflight` FAIL (without it claude.exe aborts at
                                        # startup with exit 0xC0000409, printing nothing).
    # Cross-platform base
    - "PATH"
    - "HOME"
    - "USER" # macOS: subscription/OAuth CLIs resolve Keychain credentials via $USER (else "Not logged in")
    - "USERPROFILE"
    - "CODEX_HOME"
    - "CLAUDE_CONFIG_DIR"
    # Windows OS-launch essentials. SystemRoot is load-bearing: without it the Node-based claude.exe
    # aborts at startup (exit 0xC0000409) before printing anything, and preflight reports it "did not succeed".
    - "SystemRoot"
    - "SystemDrive"
    - "windir"
    - "ComSpec"
    - "PATHEXT"
    - "TEMP"
    - "TMP"
    - "APPDATA"
    - "LOCALAPPDATA"
    - "HOMEDRIVE"
    - "HOMEPATH"
    - "NUMBER_OF_PROCESSORS"
    - "PROCESSOR_ARCHITECTURE"
    # Linux/macOS OS-launch essentials (WSL counts as Linux)
    - "TMPDIR"
    - "LD_LIBRARY_PATH"
    - "DYLD_LIBRARY_PATH"
  extra_environment: {}               # Variables the orchestrator ASSIGNS to every child process it
                                      #   starts — the agent CLI, the Check Runner, the dependency
                                      #   scanners, git/gh. The complement of allowed_environment,
                                      #   which only forwards a name and inherits whatever your shell
                                      #   exported (unset on the next machine, and a forgotten
                                      #   `export` is skipped in silence). Use it to pin a toolchain
                                      #   root or a cache path, e.g.:
                                      #     extra_environment:
                                      #       DOTNET_CLI_TELEMETRY_OPTOUT: "1"
                                      #       NUGET_PACKAGES: "/abs/path/to/repo/.toolcache/nuget"
                                      #   Values MUST be quoted strings (`1` is a YAML int and is
                                      #   refused, with a hint). An empty string is a valid value.
                                      #   Applied after forwarding, so a name in both wins here.
                                      #   Refused: `PATH` in any case (assigning it substitutes every
                                      #   binary the child runs — forward it instead), a
                                      #   secret-looking name, a name outside [A-Za-z_][A-Za-z0-9_]*,
                                      #   and two names differing only in case (Windows environment
                                      #   names are case-insensitive).
                                      #   NEVER put credentials here: the value sits in this file in
                                      #   plaintext, and nothing can check a value for secrecy. The
                                      #   agent CLIs read their own credentials from their own stores.
                                      #   `worc preflight` prints the NAMES you set, never the values.
  denied_read_paths:                  # REPLACES (does not extend) the default (.env, secrets/**). Globs
                                      #   the agent CLI may never read — enforced as --disallowedTools so
                                      #   a task can't exfiltrate secrets. Same glob dialect as protected_paths.
    - ".env"
    - "secrets/**"
  denied_commands:                    # REPLACES (does not extend) the default list — keep every entry you need
    - "git commit"
    - "git push"
    - "gh pr create"
    - "gh pr merge"
  trust_level: "auto"                 # approval policy for the mid-task dangerous-diff gate:
                                      #   strict = gate every tracked-file deletion/rename OR dependency
                                      #            manifest/lock edit (ask before continuing)
                                      #   auto   = (default) routine in-repo deletions/renames/edits do
                                      #            NOT gate; only a protected_paths match asks
                                      # Never lowers the hard ceiling (env-allowlist, bypass ban, cwd
                                      # containment). A task may override with front-matter `trust_level`.
  protected_paths: []                 # repo-relative globs that ALWAYS require approval on ANY change,
                                      # regardless of trust_level — the always-ask floor no level lowers.
                                      # Same glob dialect as checks.command_sets[].paths: "**" crosses
                                      # dirs, "*" stays within one segment (e.g. "src/security/**",
                                      # ".github/workflows/**"). Default [] = no floor.

validation:                         # input hardening gate; rejects broken tasks before any branch
  max_task_bytes: 262144            # reject a task file larger than this (bytes)
  max_task_lines: 5000              # reject a task file with more lines than this
  max_line_bytes: 8192              # reject any single line longer than this (bytes)
  max_control_ratio: 0.01           # reject if control/binary chars exceed this fraction (0.01 = 1%)
  quarantine_folder: "./.worc/tasks/rejected"   # rejected task files are moved here
  # NOT configurable (and no longer accepted as keys, config v35): the required front matter
  # (`id`, a non-blank `title`, a non-empty `Description` section) and the deny on an unrecognized
  # front-matter key are hard-coded in the task gate. `upgrade-config` strips both old keys.

checks:
  # Named per-project command sets (monorepo-ready). Empty / omitted = NO quality gate (every task
  # passes the checks node). The runner runs the union of sets whose `paths` glob the task diff; a
  # set with no `paths` always runs (on any non-empty diff); an empty diff runs nothing. Each command
  # runs as an argv list (no shell) in its `cwd`. No commands are auto-discovered — you author this.
  # These sets are the gate for EVERY flow, not just code ones: a research/documentation flow commits
  # Markdown and opens a pull request too, so give the documents you commit a set that matches them
  # (see the `docs` example below) — a formatter or Markdown lint the repository already enforces in
  # CI. Name a *checking* command: one that rewrites files trips the green-but-dirtying guard and
  # parks the task, so prefer `format:check` over `format`.
  command_sets: {}
  #
  # --- Single-root repo: one set, no `paths` (runs on any change) ---
  # command_sets:
  #   default:
  #     commands:
  #       - { name: tests, argv: [pytest] }
  #       - { name: lint,  argv: [ruff, check, .] }
  #       - { name: types, argv: [mypy, src] }
  #
  # --- Polyglot monorepo: one set per project, selected by the diff path ---
  # command_sets:
  #   backend:
  #     paths: ["backend/**"]
  #     commands:
  #       - { name: backend-tests, argv: [dotnet, test], cwd: backend/src }
  #   frontend:
  #     paths: ["mobile/**"]
  #     commands:
  #       - { name: fe-lint,  argv: [npm, run, lint], cwd: mobile }
  #       - { name: fe-tests, argv: [npm, test],      cwd: mobile }
  #   docs:                                 # extension glob: runs only when Markdown changes
  #     paths: ["**/*.md"]
  #     commands:
  #       - { name: md-lint, argv: [wastech-ctxlint] }
  #   ios:
  #     paths: ["ios/**"]
  #     timeout_seconds: 2400                 # overrides the global per-command timeout below
  #     skip_if_unavailable: true             # no xcodebuild on host -> skip (loud), don't fail task
  #     commands:
  #       - { name: ios-tests, argv: [xcodebuild, test, "-scheme", App], cwd: ios }
  timeout_seconds: 7200             # global per-command timeout (argv, no shell); per-set overrides

git:
  create_pull_request: true         # false = commit + push the task branch only, open no PR
  pr_base: "main"                   # branch the published PR targets (usually base_branch)
  # ⚠️  DANGER: auto-merge bypasses the human review gate — the last defence against shipping a wrong
  #     or malicious agent diff. All four keys default to the safe value; enable only with protected
  #     branches + required CI status checks already enforcing your quality gate. The mid-pipeline
  #     dangerous-diff approval still fires; auto-merge only affects the publish step.
  auto_merge: false                 # true: merge every published PR to pr_base automatically
  auto_merge_strategy: squash       # merge | squash | rebase  (used when a merge fires)
  auto_merge_wait_for_checks: false # true: arm GitHub-native auto-merge (--auto) — merge only after required checks pass
  # NOTE: a per-task `auto_merge: true|false` wins outright over this default. Auto-merge
  # skips the human PR review — the operator (the task author) owns that call, not the orchestrator's
  # to police.
  merge_flow: merge                 # flow `worc merge-task` runs to resolve base-merge conflicts
                                    #   (seeded editable at .worc/flows/merge.yaml). Clean merges are
                                    #   mechanical (no flow); only a conflicting base-merge runs it.
  footprint:                        # audit-trail policy. Runtime files always live under the
                                    # gitignored <repo>/.worc/ home; only the task file and its
                                    # <id>.summary.md are committed, at the repo root under tasks/.
                                    # This is a separate audit commit, not a second code commit.
    audit_commit_message: "chore(orchestrator): audit trail for {task_id}"
    audit_on_branch: task           # task = same branch as the code; sibling = <branch>-audit

telegram:                           # human-in-the-loop + notifications (optional)
  enabled: false
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"   # must resolve to a non-zero numeric chat id
  ask_timeout_s: 28800              # > 0; blocking HITL fails closed on timeout
  trace: false                      # live per-node progress feed (best-effort; node id + outcome only)

# Prompt templates are not configured here: a flow node's prompt is the content of its `role_file`
# (each flow owns its prompts under `.worc/flows/<task_type>/*.md`). Edit the role file to
# customize a node's prompt. Role files render only allowlisted path/metadata variables ({task_id}
# {stage} {repo_path} {task_path} {plan_path} {diff_path} {checks_path} {review_path} {skills_path}
# {memory_path} {subtask_order} {subtask_count} {subtask_spec_path}) — never task bodies, diffs,
# env, or secrets.

skills:                             # repo skill selection (optional)
  dynamic: false                    # supervisor proposes a node->skills map once per task; opt in (adds one turn)
  strict: false                     # false = warn+skip an unresolved operator pin; true = stop the task
  # At task start the orchestrator discovers every tracked SKILL.md in the clone (git ls-files,
  # whole-repo). Each flow node gets the skills the operator pinned on it (flow YAML `skills:`) plus,
  # when `dynamic`, the supervisor's proposed ones — the Core decides. Chosen SKILL.md files reach the
  # node as read-only reference paths (never executed, never the Claude Skill tool — Codex has none).

supervisor:                         # oversight layer above any flow (not a node) — on by default
  enabled: true                     # false = the layer is never built: no per-step notes, no whole-task
                                    #   summary turn, no subtask handoff brief, no `skills.dynamic`
                                    #   proposal, and every key below is inert (one warning says so).
                                    #   The PR body is then rendered deterministically from the run's own
                                    #   recorded facts — changed paths, steps, checks, gate verdicts,
                                    #   follow-ups — so no run ships without one. Also forces
                                    #   `memory.enabled` off for the run (see `memory`).
  role_file: "roles/supervisor.md"  # observe-lens role prompt; path-contained under roles/
  provider: claude                  # null = inherit the global primary; pin (∈ agents.allowed) to keep aligned with the models' vendor
  # `role_file` and `provider` are one per layer; model and effort are PER PHASE, because a cheap
  # per-step note and the whole-task synthesis want opposite tiers. Spend on the PRODUCER nodes, not
  # here: this layer is advisory — it never routes, reworks, or blocks — so a stronger model than
  # `agents.providers` inverts the budget. Keep every phase at or below the producers' tier.
  observe:                          # the per-step notes: how often, and how cheap
    mode: events                    # all | selected | events | none — see the table below
    triggers: [rework, failure, fallback]  # which deviations count under `events` (this is the full set)
    include_nodes: []               # node ids observed under `mode: selected`; ignored otherwise
    model: "claude-sonnet-5"        # null = the resolved provider's default model
    reasoning: low                  # null = the resolved provider's default reasoning
  finalize:                         # the whole-task synthesis — writes summary.md (the PR body)
    model: "claude-sonnet-5"        # worth more than `observe`: most readers of a long run see only this
    reasoning: medium
  handoff:                          # the subtask brief between regions of a decomposed task
    model: "claude-sonnet-5"
    reasoning: medium
  # `observe.mode` is what this layer costs, ranked by how many calls it can make:
  #   none      — never observe. `finalize` and the summary still happen: that turn is seeded by a
  #               deterministic packet of the run's facts, not by these notes. Good for a flow whose
  #               quality is already held by a blocking gate. NOTE: at `none` the observe lens
  #               (`role_file`) is never loaded at all — only the finalize lens is in force.
  #   events    — the default. Observe only a deviation: an evaluator sending work back (or accepting
  #               after exhausting its rework budget), a step whose run failed, a step that fell back
  #               to the non-primary provider. Cost tracks what went wrong, not how long the run was.
  #   selected  — observe exactly the nodes in `include_nodes`.
  #   all       — observe every executed step. Debugging setting; this is what a long run pays for.
  # `tool`, `checks` and the terminal `publish` node are never observed under ANY mode — their result
  # is already a durable fact the finalize packet carries verbatim.
  # A flow may NARROW this in its own `supervisor.observe.mode` (a content flow ships `none`) but
  # never widen it — a broader flow mode fails validation. Ranking: none < events < selected < all.
  # That check does not apply at `enabled: false`: there is no cadence to widen, so a flow declaring
  # any mode still runs. That is why switching the layer off is its own key, not a global `none`.
  # The once-per-task skill proposal (`skills.dynamic`) uses the `observe` model/effort — same cheap
  # shape — and runs regardless of `mode`, which gates per-step observations only.

logging:                            # operator log verbosity + on-disk artifact retention (optional)
  level: info                       # debug | info | warning | error. Persists the structured operator
                                    #   trace level; the --log-level CLI flag overrides it when given.
  artifacts: standard               # per-attempt provider files kept under logs/<id>/stages/.../<attempt>-<provider>/:
                                    #   minimal  = result.json only (even on failure)
                                    #   standard = + stdout.log, stderr.log  (events.jsonl is a dup of stdout)
                                    #   full     = all (request.json, events.jsonl, output-schema.json, ...)
                                    # Prompt-audit is independent (see prompt_audit). Reclaim disk with
                                    # `worc logs clean [--keep N | --all]`.
  clean_runs_on_success: true       # a task that finishes SUCCESSFULLY evicts its own per-task state under
                                    #   .worc/runs/ (frozen control + instruction bundles, sealed exchanges).
                                    #   Failed / parked / manual-action tasks are NEVER cleaned automatically,
                                    #   and quarantined exchange evidence is never cleaned in either mode.
                                    # false = keep every run's frozen inputs and seals for analysis; reclaim
                                    #   on demand with `worc runs clean [--keep N] [--include-quarantine]`
                                    #   (that command works either way — this only decides whether the
                                    #   orchestrator also does it itself). Per-task log dirs are separate:
                                    #   they stay with `worc logs clean`. See guide/footprint.md.

memory:                             # persistent, repo-scoped memory (optional)
  enabled: true                     # false / omit the whole block = today's behavior: no store, no
                                    #   candidate delta, empty memory packets, CLI no-op, no cleanup
                                    # Needs `supervisor.enabled: true`: that layer's closing turn is the
                                    #   only path that writes anything memory can read back, so with the
                                    #   layer off this resolves to false for the run and a warning names
                                    #   both keys. Set it false yourself to make the file say what runs.
  short_term_ttl_days: 30           # episodic entries expire after N days (long-term has no TTL)
  # Per-node retrieval packet caps — deliberately small (precision over recall):
  packet_max_lines: 120             # hard line backstop for a per-node memory brief
  packet_max_long_term: 3           # max long-term lessons in one packet
  packet_max_entity: 5              # max entity cards in one packet
  packet_max_episodic: 3            # inert since V2 — episodes are a write-only tier, never injected
  # Promotion to long-term — a candidate lesson must clear this gate, else it stays short-term:
  promote_min_tasks: 2              # recurred in >= this many tasks (now only gates artifact-backed;
                                    #   repo-verified / human / review lessons promote on first sight)
  promote_window_days: 60           # ... within this many days
  # Background-cleanup budget — bounded autonomy; runs only between tasks, never delays a pickup:
  cleanup_min_interval_s: 300       # minimum seconds between cleanup passes
  cleanup_max_scanned: 200          # max records examined per pass
  cleanup_max_edits: 50             # max records changed per pass
  cleanup_max_wall_clock_s: 5.0     # per-pass wall-clock ceiling (seconds)
  cleanup_promotions_per_pass: 0    # 0 = cleanup NEVER creates a long-term lesson (only demote /
                                    #   expire / quarantine / merge)

tools:                              # custom tool nodes (optional)
  default_timeout_seconds: 3600     # flow-wide default wall-clock timeout (s) for a `tool` node whose
                                    #   own `timeout_seconds` is unset (3600 = 1h). Omit the block for
                                    #   the same default. A tool that exceeds it is an infra failure →
                                    #   the task parks at manual_action_required (not a quality fail).

prompt_audit: false                 # record each step's prompt + who (provider/model/attempt/fallback/
                                    # status) under logs/<task-id>/prompt-audit/, in chronological order.
                                    # A per-task `prompt_audit: true|false` always overrides this (task wins).
