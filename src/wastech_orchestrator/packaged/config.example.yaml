# Example configuration for wastech-orchestrator.
# Copy to config.yaml and fill it in for your project. config.yaml is NOT committed to git.
# This is the packaged copy used by `wastech-orchestrator init`; keep it in sync with the
# repo-root config.example.yaml

schema_version: 24                  # config format version; the orchestrator refuses newer configs

orchestrator:
  auto_mode:
    enabled: false                  # when true, pick the next pending task after terminal cleanup
    confirm_next_task: false        # when true, ask approve/deny in Telegram before claiming each
                                    # pending task; deny/timeout stops chaining (requires telegram)
  poll_interval_seconds: 300        # `watch` tick: fetch/pull base_branch to discover git-pushed
                                    # tasks, then process pending. 0 = single-pass (no loop, no sync)
  queue: "default"                  # this instance's queue selector: only pick tasks whose `queue`
                                    # equals this (string equality). Lets several worc instances share
                                    # one task pool without colliding. Override per launch: --queue

repo:
  url: "git@github.com:OWNER/REPO.git"
  local_path: "./workspace/repo"
  base_branch: "main"
  branch_prefix: "worc"             # task branches: worc/<task-id>-<slug>

paths:                              # where the task lifecycle lives (optional; omit = defaults)
  tasks_dir: "tasks"                # repo-relative dir holding pending/processing/done/failed.
                                    # Rename to avoid clashing with a repo that already uses tasks/.
                                    # Must be repo-relative (no .. / absolute) and NOT under .worc/
                                    # (that home is gitignored — the audit trail would be lost). The
                                    # lifecycle subfolder names are fixed. `install` only scaffolds
                                    # the default tasks/; for another name, create its subfolders.

agents:
  allowed:
    - claude
    - codex

  max_stage_attempts: 3
  max_fix_cycles: 15
  max_total_fix_iterations: 30      # hard global cap across all fix loops (and all subtasks); >= max_fix_cycles

  decomposition:                    # optional task decomposition (§5.1); OFF by default
    enabled: false
    max_subtasks: 8                 # a split with n > this (or n < 2) is rejected; runs as a single task

  retry:                            # optional: transient provider-failure recovery; safe defaults
    max_attempts: 2                 # same-provider retries AFTER the first attempt (per provider); 0 disables
    base_delay_s: 2.0               # exponential backoff: min(base * 2**k, max_delay_s), no jitter
    max_delay_s: 30.0               # cap per-retry delay (total retry window stays well under a minute)
    max_blocked_s: 3600.0           # both providers down -> park as resumable; fail only after this much parked time

  # Provider routing is node-based: a flow node declares its own `provider` (else the global
  # primary below). Exactly one configured provider must set `primary: true` — it runs every node
  # with no `provider` field and is the sole infrastructure-fallback target. It must be in `allowed`.
  # `model`/`reasoning` below are explicit defaults; blank either ("" / null) to use the CLI default.
  # Full access — Codex `sandbox: danger-full-access` or Claude `--permission-mode bypassPermissions`
  # in `extra_args` — is operator-selectable but rejected at preflight unless `strict_isolation: false`.
  providers:
    claude:
      command: "claude"
      model: "claude-sonnet-4-6"   # "" = use the Claude CLI/account default
      reasoning: high          # low | medium | high | xhigh | max
      timeout_seconds: 7200
      max_turns: 400           # Claude turn cap (positive int); "none" or "max" = no cap (unlimited)
      max_turns_gate: false    # when true, hitting max_turns pauses for a Telegram continue/stop
                               # prompt (requires telegram); a low cap (~50–100) is then safe
      permission_profile: "workspace-write"
      extra_args: []
      primary: true            # the global primary (exactly one provider; must be in `allowed`)
    codex:
      command: "codex"
      model: "gpt-5.5"         # "" = use the Codex CLI/account default
      reasoning: high          # minimal | low | medium | high | xhigh | max->xhigh
      timeout_seconds: 7200
      sandbox: "workspace-write"   # workspace-write | read-only | danger-full-access (needs strict_isolation: false)
      permission_profile: "workspace-write"
      extra_args: []

security:
  strict_isolation: true
  allowed_environment:                  # REPLACES (does not extend) the default — keep the OS-launch
                                        # essentials for YOUR OS or the spawned CLI may fail to start.
                                        # A name absent from the host OS is simply skipped, so this
                                        # cross-platform list is safe to keep as-is on any OS.
    # Cross-platform base
    - "PATH"
    - "HOME"
    - "USER" # macOS: subscription/OAuth CLIs resolve Keychain credentials via $USER (else "Not logged in")
    - "USERPROFILE"
    - "CODEX_HOME"
    - "CLAUDE_CONFIG_DIR"
    # Windows OS-launch essentials. SystemRoot is load-bearing: without it the Node-based claude.exe
    # aborts at startup (exit 0xC0000409) before printing anything, and preflight reports it "did not succeed".
    - "SystemRoot"
    - "SystemDrive"
    - "windir"
    - "ComSpec"
    - "PATHEXT"
    - "TEMP"
    - "TMP"
    - "APPDATA"
    - "LOCALAPPDATA"
    - "HOMEDRIVE"
    - "HOMEPATH"
    - "NUMBER_OF_PROCESSORS"
    - "PROCESSOR_ARCHITECTURE"
    # Linux/macOS OS-launch essentials (WSL counts as Linux)
    - "TMPDIR"
    - "LD_LIBRARY_PATH"
    - "DYLD_LIBRARY_PATH"
  denied_read_paths:
    - ".env"
    - "secrets/**"
  denied_commands:                    # REPLACES (does not extend) the default list — keep every entry you need
    - "git commit"
    - "git push"
    - "gh pr create"
    - "gh pr merge"
  deletion_approval_exempt_paths: []  # DANGER: deletions/renames matching these repo-relative globs
                                      # SKIP the dangerous-diff approval gate (rule #14). Default [] =
                                      # every deletion is gated. You own the risk: an exempted deletion
                                      # gets no mid-run approval (and, under git.auto_merge, no PR review
                                      # either) — it still appears in the PR diff / logs/<id>/current.diff.
                                      # Dependency manifests/locks are NEVER exemptable. Use "**/*.md" for
                                      # any .md anywhere; "*.md" matches only top-level; "docs/**" a subtree.

validation:                         # input hardening gate (§19); rejects broken tasks before any branch
  max_task_bytes: 262144
  max_task_lines: 5000
  max_line_bytes: 8192
  max_control_ratio: 0.01
  required_fields: ["id", "title"]
  reject_unknown_fields: true
  quarantine_folder: "./.worc/tasks/rejected"

checks:
  # Named per-project command sets (monorepo-ready). Empty / omitted = NO quality gate (every task
  # passes the checks node). The runner runs the union of sets whose `paths` glob the task diff; a
  # set with no `paths` always runs (on any non-empty diff); an empty diff runs nothing. Each command
  # runs as an argv list (no shell) in its `cwd`. No commands are auto-discovered — you author this.
  command_sets: {}
  #
  # --- Single-root repo: one set, no `paths` (runs on any change) ---
  # command_sets:
  #   default:
  #     commands:
  #       - { name: tests, argv: [pytest] }
  #       - { name: lint,  argv: [ruff, check, .] }
  #       - { name: types, argv: [mypy, src] }
  #
  # --- Polyglot monorepo: one set per project, selected by the diff path ---
  # command_sets:
  #   backend:
  #     paths: ["backend/**"]
  #     commands:
  #       - { name: backend-tests, argv: [dotnet, test], cwd: backend/src }
  #   frontend:
  #     paths: ["mobile/**"]
  #     commands:
  #       - { name: fe-lint,  argv: [npm, run, lint], cwd: mobile }
  #       - { name: fe-tests, argv: [npm, test],      cwd: mobile }
  #   docs:                                 # extension glob: runs only when Markdown changes
  #     paths: ["**/*.md"]
  #     commands:
  #       - { name: md-lint, argv: [wastech-ctxlint] }
  #   ios:
  #     paths: ["ios/**"]
  #     timeout_seconds: 2400                 # overrides the global per-command timeout below
  #     skip_if_unavailable: true             # no xcodebuild on host -> skip (loud), don't fail task
  #     commands:
  #       - { name: ios-tests, argv: [xcodebuild, test, "-scheme", App], cwd: ios }
  timeout_seconds: 7200             # global per-command timeout (argv, no shell); per-set overrides

git:
  create_pull_request: true
  pr_base: "main"
  # ⚠️  DANGER: auto-merge bypasses the human review gate — the last defence against shipping a wrong
  #     or malicious agent diff. All four keys default to the safe value; enable only with protected
  #     branches + required CI status checks already enforcing your quality gate. The mid-pipeline
  #     dangerous-diff approval still fires; auto-merge only affects the publish step.
  auto_merge: false                 # true: merge every published PR to pr_base automatically
  auto_merge_strategy: squash       # merge | squash | rebase  (used when a merge fires)
  auto_merge_wait_for_checks: false # true: arm GitHub-native auto-merge (--auto) — merge only after required checks pass
  # NOTE: a per-task `auto_merge: true|false` wins outright over this default (PRE.2). Auto-merge
  # skips the human PR review — the operator (the task author) owns that call; see docs/operations.md.
  merge_flow: merge                 # flow `worc merge-task` runs to resolve base-merge conflicts
                                    #   (seeded editable at .worc/flows/merge.yaml). Clean merges are
                                    #   mechanical (no flow); only a conflicting base-merge runs it.
  footprint:                        # audit-trail policy (§21). Runtime files always live under the
                                    # gitignored <repo>/.worc/ home; only the task file and its
                                    # <id>.summary.md are committed, at the repo root under tasks/.
                                    # This is a separate audit commit, not a second code commit.
    audit_commit_message: "chore(orchestrator): audit trail for {task_id}"
    audit_on_branch: task           # task = same branch as the code; sibling = <branch>-audit

telegram:                           # human-in-the-loop + notifications (optional)
  enabled: false
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"   # must resolve to a non-zero numeric chat id
  ask_timeout_s: 28800              # > 0; blocking HITL fails closed on timeout
  trace: false                      # live per-node progress feed (best-effort; node id + outcome only)

# Prompt templates are not configured here: a flow node's prompt is the content of its `role_file`
# (packaged flow roles, or `.worc/flows/roles/*.md` for an operator flow). Edit the role file to
# customize a node's prompt. Role files render only allowlisted path/metadata variables ({task_id}
# {stage} {repo_path} {task_path} {plan_path} {diff_path} {checks_path} {review_path} {skills_path}
# {subtask_order} {subtask_count} {subtask_spec_path}) — never task bodies, diffs, env, or secrets.

skills:                             # repo skill selection (optional, §2.1)
  dynamic: true                     # supervisor proposes a node->skills map once per task (skip when no skills)
  strict: false                     # false = warn+skip an unresolved operator pin; true = stop the task
  # At task start the orchestrator discovers every tracked SKILL.md in the clone (git ls-files,
  # whole-repo). Each flow node gets the skills the operator pinned on it (flow YAML `skills:`) plus,
  # when `dynamic`, the supervisor's proposed ones — the Core decides. Chosen SKILL.md files reach the
  # node as read-only reference paths (never executed, never the Claude Skill tool — Codex has none).

supervisor:                          # constant oversight layer above any flow — always active (§P2.1)
  role_file: "roles/supervisor.md"  # role prompt for the supervisor; path-contained under roles/
  model: "claude-opus-4-8"          # null = use the global primary provider's default model
  reasoning: medium                 # null = use the global primary provider's default reasoning

logging:                            # operator log verbosity + on-disk artifact retention (optional)
  level: info                       # debug | info | warning | error. Persists the structured operator
                                    #   trace level; the --log-level CLI flag overrides it when given.
  artifacts: standard               # per-attempt provider files kept under logs/<id>/stages/.../<attempt>-<provider>/:
                                    #   minimal  = result.json only (even on failure)
                                    #   standard = + stdout.log, stderr.log  (events.jsonl is a dup of stdout)
                                    #   full     = all (request.json, events.jsonl, output-schema.json, ...)
                                    # Prompt-audit is independent (see prompt_audit). Reclaim disk with
                                    # `worc logs clean [--keep N | --all]`.

memory:                             # persistent, repo-scoped memory (optional; docs/backlog/memory/)
  enabled: true                     # false / omit the whole block = today's behavior: no store, no
                                    #   candidate delta, empty memory packets, CLI no-op, no cleanup
  short_term_ttl_days: 30           # episodic entries expire after N days (long-term has no TTL)
  # Per-node retrieval packet caps — deliberately small (precision over recall):
  packet_max_lines: 120             # hard line backstop for a per-node memory brief
  packet_max_long_term: 3           # max long-term lessons in one packet
  packet_max_entity: 5              # max entity cards in one packet
  packet_max_episodic: 3            # max recent-episode notes in one packet
  # Promotion to long-term — a candidate lesson must clear this gate, else it stays short-term:
  promote_min_tasks: 2              # recurred in >= this many tasks ...
  promote_window_days: 60           # ... within this many days
  # Background-cleanup budget — bounded autonomy; runs only between tasks, never delays a pickup:
  cleanup_min_interval_s: 300       # minimum seconds between cleanup passes
  cleanup_max_scanned: 200          # max records examined per pass
  cleanup_max_edits: 50             # max records changed per pass
  cleanup_max_wall_clock_s: 5.0     # per-pass wall-clock ceiling (seconds)
  cleanup_promotions_per_pass: 0    # 0 = cleanup NEVER creates a long-term lesson (only demote /
                                    #   expire / quarantine / merge)

prompt_audit: false                 # record each step's prompt + who (provider/model/attempt/fallback/
                                    # status) under logs/<task-id>/prompt-audit/, in chronological order.
                                    # A per-task `prompt_audit: true|false` always overrides this (task wins).
