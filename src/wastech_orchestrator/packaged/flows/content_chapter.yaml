# Packaged built-in flow: content_chapter — the Wastime Journey chapter editor (the workhorse).
#
# Reworks one RU chapter of the content repo in place: a read-only scout builds a brief, an editor
# revises the chapter, a deterministic prose gate (the `check_journey` tool) enforces the hard
# structural constraints, a product-accuracy verifier and a story critic each block on quality, and a
# style pass polishes the language before publish. Every gate/rework routes through `fixing`, which
# re-enters the deterministic gate (`fixing → constraints`) so a fix can never break the limits.
#
# output_policy: code_change — the chapter `.md` files are edited in place; the diff IS the
# deliverable. publishing: pull_request is the ceiling; run the content repo with
# `git.create_pull_request: false` (install `--no-create-pr`) to land edits as a local commit with no
# PR. The deterministic gate is `check_journey` (delivered to `.worc/tools/` by `worc install`); it
# reads only the changed chapter paths from the diff and enforces the mode-specific prose rules
# (heading hierarchy, required Purpose/Emotional-point sections, the "не …, а …" AI-antithesis
# pattern, and for `en`/`book` a hard per-page length cap) — never pre-existing issues elsewhere.
#
# The supervisor is a constant layer above the flow (not a node); `emit_follow_ups` is deliberately
# omitted (a code-oriented capability). Blocking evaluators are capped by their named-loop budgets
# (`accuracy_fix` / `critic_fix`), not by `max_rework_per_stage` (a non-blocking-only knob).
#
# gate_severity (per evaluator, default `high`) sets the minimum finding severity that gates: `high`
# blocks on high/critical/blocking and lets medium/low advise; lower it to raise the quality bar.
# For detail-critical content you can set `gate_severity: low` on the critics below so ANY finding
# forces a rework — but a stricter gate means more rework rounds, so raise the matching budget
# (`accuracy_fix` / `critic_fix`) to give it headroom, or the loop may exhaust the budget and park
# the task to `manual`. Shipped at the default `high`; uncomment the lines below to opt in.
flow:
  name: content_chapter
  task_type: content_chapter
  permission_ceiling: workspace-write
  output_policy: code_change
  publishing: pull_request

  nodes:
    - id: context
      kind: agent
      role_file: content_chapter/context.md
      session_scope: fresh_disposable
      permission_profile: read-only
    - id: revise
      kind: agent
      role_file: content_chapter/revise.md
      session_scope: editing_lineage
      permission_profile: workspace-write
    - id: constraints
      kind: tool
      tool: check_journey
      args: { mode: ru }
    - id: product_accuracy
      kind: evaluator
      role: verifier
      role_file: content_chapter/product_accuracy.md
      blocking: true
      # gate_severity: low  # block on ANY finding (default high); raise `accuracy_fix` to match
    - id: story_critic
      kind: evaluator
      role: critic
      role_file: content_chapter/story_critic.md
      blocking: true
      # gate_severity: low  # block on ANY finding (default high); raise `critic_fix` to match
    - id: style
      kind: agent
      role_file: content_chapter/style.md
      session_scope: editing_lineage
      lineage_affinity: revise
      permission_profile: workspace-write
      # Language polish is a bounded pass, not fresh reasoning, so it runs at medium regardless of
      # the flow-wide default — less wall-time on the tail, no quality loss.
      reasoning: medium
    - id: fixing
      kind: agent
      role_file: content_chapter/fixing.md
      session_scope: editing_lineage
      lineage_affinity: revise
      permission_profile: workspace-write
    - id: publish
      kind: publish
      policy: pull_request

  edges:
    - { from: context, to: revise }
    - { from: revise, to: constraints }
    - { from: constraints, to: product_accuracy, outcome: pass }
    - { from: constraints, to: fixing, outcome: fail, loop: constraint_fix }
    - { from: product_accuracy, to: story_critic, outcome: accept }
    - { from: product_accuracy, to: fixing, outcome: rework, loop: accuracy_fix }
    - { from: story_critic, to: style, outcome: accept }
    - { from: story_critic, to: fixing, outcome: rework, loop: critic_fix }
    - { from: fixing, to: constraints } # every fix re-enters the deterministic gate
    - { from: style, to: publish }

  budgets:
    constraint_fix: 8
    accuracy_fix: 3
    critic_fix: 3

  supervisor:
    role_file: content_chapter/supervisor.md
    finalize_role_file: content_chapter/summary.md
