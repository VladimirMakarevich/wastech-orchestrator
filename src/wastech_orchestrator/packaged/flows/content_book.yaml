# Packaged built-in flow: content_book — assemble the approved chapters into one book (run once).
#
# Stitches the already-approved Wastime Journey chapters into a single book: a unified voice, a table
# of contents, an intro/outro, and smoothed transitions per the Story Bible map. A book critic blocks
# on through-line arc, cross-chapter repetition, unified voice, and continuity; the same deterministic
# `check_journey` gate (mode: book) then confirms no assembled page breaks the limits.
#
# book_fixing re-enters the critic (NOT assemble): it edits the assembled book, and re-running
# assemble would re-stitch from the source chapters and discard that fix. output_policy: code_change;
# publishing: pull_request is the ceiling (run with `git.create_pull_request: false` for local commit,
# no PR). The supervisor is a constant layer above the flow; `emit_follow_ups` is omitted.
flow:
  name: content_book
  task_type: content_book
  permission_ceiling: workspace-write
  output_policy: code_change
  publishing: pull_request

  nodes:
    - id: assemble
      kind: agent
      role_file: content_book/assemble.md
      session_scope: editing_lineage
      permission_profile: workspace-write
    - id: book_critic
      kind: evaluator
      role: critic
      role_file: content_book/book_critic.md
      blocking: true
    - id: book_fixing
      kind: agent
      role_file: content_book/book_fixing.md
      session_scope: editing_lineage
      lineage_affinity: assemble
      permission_profile: workspace-write
    - id: constraints
      kind: tool
      tool: check_journey
      args: { mode: book }
    - id: publish
      kind: publish
      policy: pull_request

  edges:
    - { from: assemble, to: book_critic }
    - { from: book_critic, to: constraints, outcome: accept }
    - { from: book_critic, to: book_fixing, outcome: rework, loop: book_critic_fix }
    - { from: book_fixing, to: book_critic } # re-critique the fixed book (never re-assemble)
    - { from: constraints, to: publish, outcome: pass }
    - { from: constraints, to: book_fixing, outcome: fail, loop: book_constraint_fix }

  budgets:
    book_critic_fix: 4
    book_constraint_fix: 6

  supervisor:
    role_file: content_book/supervisor.md
    finalize_role_file: content_book/summary.md
