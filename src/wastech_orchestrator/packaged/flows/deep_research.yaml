# Packaged built-in flow: deep_research.
# Canonical version.
#
# ----------------------------------------------------------------------------------------------------
# Per-node tuning (ALL fields below are OPTIONAL — omit one to inherit the default). Every
# agent/evaluator node carries the provider/model/reasoning slots commented out so the full
# configuration surface is visible; uncomment and edit to pin a single node.
#   agent + evaluator nodes:
#     provider:  codex | claude            which agent runs the node (∈ agents.allowed); default: global primary
#     model:     <model id>                overrides agents.providers.<provider>.model for THIS node
#     reasoning: minimal|low|medium|high|xhigh|max  default: agents.providers.<provider>.reasoning
#     network_access: true | false         per-node network grant/deny; default: flow network_policy (research)
#   agent nodes also: timeout_seconds, extra_args, best_effort, permission_profile (≤ flow ceiling), when
#   evaluator nodes also: blocking, max_rework_per_stage, gate_severity (min severity that gates;
#     built-in default high — this flow sets `medium` in `defaults.evaluator` below, see the note there)
#     (a non-blocking evaluator that spends max_rework_per_stage with a finding still open accepts +
#      continues — never manual — and warns you via a console warning + a ⚠️ telegram trace)
#   Disabling a node is PER-TASK: set `nodes.<id>.enabled: false` in the task file.
# ----------------------------------------------------------------------------------------------------
flow:
  name: deep_research
  task_type: deep_research
  permission_ceiling: workspace-write
  output_policy: repository_document
  publishing: documentation_pull_request
  network_policy: research

  defaults:
    # gate_severity: medium — this flow's evaluators judge whether a research deliverable is GOOD
    # ENOUGH, not whether code is correct, so they have no natural way to emit `high`/`critical`; at
    # the built-in default (`high`) a substantive `medium` finding is recorded and then dropped.
    # Both evaluators here are `blocking: false`, so the worst case is `max_rework_per_stage` extra
    # rounds and then accept + a ⚠️ warning — never `manual_action_required`.
    evaluator:
      { session_scope: fresh_disposable, permission_profile: read-only, gate_severity: medium }

  nodes:
    - id: refinement
      kind: agent
      role_file: deep_research/refinement.md
      session_scope: fresh_disposable
      permission_profile: read-only
      network_access: false
      hitl: { allow_question: true, allow_approval: false }
      when: { fact: derived.needs_refinement }
      # optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    # The repository analysis runs as THREE sequential passes over disjoint surfaces, each with a
    # fresh context window and a narrow mandatory remit (core → entry points/adapters → plan of
    # record + tests). One node asked to walk everything self-triages: it goes deep on what it
    # recognises and labels the rest "no findings" (measured: 18% of the in-scope files opened, with
    # 93% of the turn budget unused). The remit is what forces even depth — a pass that may only
    # report on the CLI cannot spend its budget re-reading the core. Roughly flat total cost, since
    # each pass reads less. For a small question, disable the passes you do not need PER TASK
    # (`nodes.analysis_surfaces.enabled: false`) rather than editing this graph.
    - id: analysis_core
      kind: agent
      role_file: deep_research/analysis_core.md
      session_scope: fresh_disposable
      permission_profile: read-only
      network_access: false
      # Delivery history is prime evidence for a plan-versus-implementation audit, so these
      # three ask for the read-only git verbs. Inert unless the operator sets
      # security.allow_git_evidence — and the node stays read-only when they do: the verbs only
      # report and the sandbox denies every write.
      git_evidence: true
      # optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    - id: analysis_surfaces
      kind: agent
      role_file: deep_research/analysis_surfaces.md
      session_scope: fresh_disposable
      permission_profile: read-only
      network_access: false
      # Delivery history is prime evidence for a plan-versus-implementation audit, so these
      # three ask for the read-only git verbs. Inert unless the operator sets
      # security.allow_git_evidence — and the node stays read-only when they do: the verbs only
      # report and the sandbox denies every write.
      git_evidence: true
      # optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    - id: analysis_docs_tests
      kind: agent
      role_file: deep_research/analysis_docs_tests.md
      session_scope: fresh_disposable
      permission_profile: read-only
      network_access: false
      # Delivery history is prime evidence for a plan-versus-implementation audit, so these
      # three ask for the read-only git verbs. Inert unless the operator sets
      # security.allow_git_evidence — and the node stays read-only when they do: the verbs only
      # report and the sandbox denies every write.
      git_evidence: true
      # optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    # Measures the audit instead of reading it: every subsystem the task declares must show a
    # traced property, not a bare "no findings" label. It reads the three passes' own reports
    # through the `{<node_id>_path}` channel and re-derives their file sets from the repository, so
    # a thin pass is caught before `synthesis` writes a conclusion on top of it. Its rework edge
    # re-enters the chain at `analysis_core`, because a gap can sit in any of the three remits and
    # only the pass that owns it can close it; each pass then works from this gate's findings, so a
    # re-entry is bounded by the named gaps rather than a second full sweep.
    - id: coverage_gate
      kind: evaluator
      role: verifier
      role_file: deep_research/coverage.md
      session_scope: fresh_disposable
      permission_profile: read-only
      network_access: false
      blocking: false
      max_rework_per_stage: 2
      # optional overrides (uncomment to pin this evaluator):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # network_access: false
    - id: external_research
      kind: agent
      role_file: deep_research/external_research.md
      session_scope: fresh_disposable
      permission_profile: read-only
      network_access: true
      when: { fact: config.external_research }
      # optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # timeout_seconds: 7200
      # network_access: true
      # extra_args: []
    - id: architecture_design
      kind: agent
      role_file: deep_research/architecture_design.md
      session_scope: fresh_disposable
      permission_profile: workspace-write
      network_access: false
      # optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # reasoning: xhigh
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    - id: synthesis
      kind: agent
      role_file: deep_research/synthesis.md
      session_scope: fresh_disposable
      permission_profile: workspace-write
      network_access: false
      # optional overrides (uncomment to pin this node):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # timeout_seconds: 7200
      # network_access: false
      # extra_args: []
    - id: citation_check
      kind: checks
      checker: citation
    - id: fact_verification
      kind: evaluator
      role: verifier
      role_file: deep_research/verifier.md
      session_scope: fresh_disposable
      permission_profile: read-only
      network_access: true
      blocking: false
      max_rework_per_stage: 1
      # optional overrides (uncomment to pin this evaluator):
      # provider: claude
      # model: claude-opus-5
      # reasoning: high
      # network_access: true
    - id: critical_review
      kind: evaluator
      role: critic
      role_file: deep_research/critic.md
      session_scope: resume_own_lineage
      permission_profile: read-only
      network_access: true
      blocking: false
      max_rework_per_stage: 3
      # optional overrides (uncomment to pin this evaluator):
      # provider: claude
      # model: claude-opus-5
      # reasoning: xhigh
      # network_access: true
    - id: publish
      kind: publish
      policy: documentation_pull_request

  edges:
    - { from: refinement, to: analysis_core }
    - { from: analysis_core, to: analysis_surfaces }
    - { from: analysis_surfaces, to: analysis_docs_tests }
    - { from: analysis_docs_tests, to: coverage_gate }
    - { from: coverage_gate, to: external_research, outcome: accept }
    - { from: coverage_gate, to: analysis_core, outcome: rework, budget: 2 }
    - { from: external_research, to: architecture_design }
    - { from: architecture_design, to: synthesis }
    - { from: synthesis, to: citation_check }
    - { from: citation_check, to: fact_verification, outcome: pass }
    - { from: citation_check, to: synthesis, outcome: fail, budget: 1 }
    - { from: fact_verification, to: critical_review, outcome: accept }
    - { from: fact_verification, to: synthesis, outcome: rework, budget: 2 }
    - { from: critical_review, to: publish, outcome: accept }
    - { from: critical_review, to: synthesis, outcome: rework, budget: 3 }

  budgets:
    global_fix_iterations: 12

  # Flow-local supervisor wording (prompt-and-supervisor ADR). Only `finalize_role_file` is set: the
  # whole-task summary is the operator's ONLY view of an expensive research run and it becomes the
  # pull-request body, and the built-in finalize lens is written for a code change ("grounded in the
  # actual committed change") — applied to a deliverable that is two new Markdown files it produced a
  # summary with two false claims and re-presented the critic's central finding as a strength.
  # `deep_research/summary.md` is that lens for a research deliverable, and it forbids first-person
  # verification claims: the finalize turn describes what the pipeline did, never what it personally
  # re-opened. The gate verdicts it must ground those statements in are appended by the orchestrator.
  # `emit_follow_ups` stays OFF — it is a code-oriented capability; the evaluators' own findings reach
  # the summary and the PR body regardless.
  supervisor:
    finalize_role_file: deep_research/summary.md
