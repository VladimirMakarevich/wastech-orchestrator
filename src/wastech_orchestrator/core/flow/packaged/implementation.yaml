# Packaged built-in flow: implementation.
# Canonical version; co-design reference in docs/backlog/flows/co-design/implementation.yaml.
flow:
  name: implementation
  task_type: implementation
  permission_ceiling: workspace-write
  output_policy: code_change
  publishing: pull_request

  defaults:
    evaluator:
      session_scope: fresh_disposable
      permission_profile: read-only
      max_rework_per_stage: 1

  nodes:
    - id: refinement
      kind: agent
      role_file: roles/refinement.md
      session_scope: fresh_disposable
      permission_profile: read-only
      hitl: { allow_question: true, allow_approval: false }
      when: { fact: derived.needs_refinement }
    - id: planning
      kind: agent
      role_file: roles/planning.md
      session_scope: fresh_disposable
      permission_profile: read-only
      hitl: { allow_question: true, allow_approval: true }
    - id: implementation
      kind: agent
      role_file: roles/implementation.md
      session_scope: editing_lineage
      permission_profile: workspace-write
    - id: supervise_impl
      kind: evaluator
      role: supervisor
      role_file: roles/supervisor.md
      session_scope: fresh_disposable
      permission_profile: read-only
      max_rework_per_stage: 1
    - id: testing_quality
      kind: evaluator
      role: test_quality
      role_file: roles/testing.md
      session_scope: fresh_disposable
      permission_profile: read-only
      blocking: false
      max_rework_per_stage: 1
      when: { fact: config.hybrid_testing }
    - id: testing
      kind: checks
      checker: command_profile
      discovery: { mode: auto, approve_command_changes: true }
    - id: review
      kind: evaluator
      role: review
      role_file: roles/review.md
      session_scope: fresh_disposable
      permission_profile: read-only
    - id: fixing
      kind: agent
      role_file: roles/fixing.md
      session_scope: editing_lineage
      lineage_affinity: implementation
      permission_profile: workspace-write
    - id: supervise_fix
      kind: evaluator
      role: supervisor
      role_file: roles/supervisor.md
      session_scope: fresh_disposable
      permission_profile: read-only
      max_rework_per_stage: 1
    - id: summary
      kind: evaluator
      role: supervisor
      role_file: roles/supervisor-final.md
      session_scope: fresh_disposable
      permission_profile: read-only
      evaluation_kind: final_handoff
      blocking: false
      when: { fact: config.summary_enabled }
    - id: publish
      kind: publish
      policy: pull_request

  edges:
    - { from: refinement, to: planning }
    - { from: planning, to: implementation }
    - { from: implementation, to: supervise_impl }
    - { from: supervise_impl, to: testing_quality, outcome: accept }
    - { from: supervise_impl, to: fixing, outcome: rework, budget: 1 }
    - { from: testing_quality, to: testing, outcome: accept }
    - { from: testing_quality, to: fixing, outcome: rework, budget: 1 }
    - { from: testing, to: review, outcome: pass }
    - { from: testing, to: fixing, outcome: fail, loop: test_fix }
    - { from: review, to: summary, outcome: accept }
    - { from: review, to: fixing, outcome: rework, loop: review_fix }
    - { from: fixing, to: supervise_fix }
    - { from: supervise_fix, to: testing_quality, outcome: accept }
    - { from: supervise_fix, to: fixing, outcome: rework, budget: 1 }
    - { from: summary, to: publish }

  budgets:
    global_fix_iterations: 30
    test_fix: 15
    review_fix: 15

  decomposition:
    proposed_by: planning
    gate: { min: 2, max: 8, linear_depends_on: true }
    sub_flow:
      [
        implementation,
        supervise_impl,
        testing_quality,
        testing,
        review,
        fixing,
        supervise_fix,
      ]
    commit_each_subtask: true
    shared_budget: global_fix_iterations
